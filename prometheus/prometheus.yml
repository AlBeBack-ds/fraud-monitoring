global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: fraud_detector
    static_configs:
      - targets: ["fraud_detector:8000"]
        labels:
          service: scoring

  - job_name: score_writer
    static_configs:
      - targets: ["score_writer:8001"]
        labels:
          service: writer

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  - job_name: prometheus
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["localhost:9090"]
